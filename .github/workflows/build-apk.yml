name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            ANDROID_HOME: /usr/local/lib/android/sdk
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: wrapper

            - name: Install Android SDK + NDK
              run: |
                  SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
                  yes | "$SDKM" --licenses >/dev/null || true
                  "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358"

            - run: chmod +x gradlew

            - name: Fetch Gradle wrapper (retry)
              run: |
                  set +e
                  for attempt in 1 2 3 4 5; do
                    ./gradlew --version && exit 0
                    echo "Gradle wrapper fetch failed (attempt ${attempt}/5), waiting..."
                    sleep 30
                  done
                  exit 1

            - name: Assemble debug APK
              run: ./gradlew assembleDebug --no-daemon

            - uses: actions/upload-artifact@v4
              with:
                  name: AxcelModifier-debug
                  path: app/build/outputs/apk/debug/*.apk
